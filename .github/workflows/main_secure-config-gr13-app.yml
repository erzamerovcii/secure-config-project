name: Build and deploy Node.js app to Azure Web App - secure-config-gr13-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: npm ci

      - name: Create deployment package
        run: |
          zip -r release.zip \
            server.js \
            package.json \
            package-lock.json \
            public \
            node_modules

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_D6AEA08F817F49FE9B434804057A92F3 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_85AD664F7ADE47729F14D00B719EAC35 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_273A1FBD785441F391B978E518D80970 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'secure-config-gr13-app'
          slot-name: 'Production'
          package: release.zip